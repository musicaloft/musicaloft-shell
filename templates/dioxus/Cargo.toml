[package]
name = "dioxus-app"
version = "0.1.0"
authors = ["municorn <municorn@musicaloft.com>"]
edition = "2024"

[dependencies]
dioxus = { version = "0.7.9", features = ["router", "fullstack"] }

# dx enables exactly one of these per build: `web` for the wasm client and
# `server` for the fullstack server binary. keep platform-specific
# dependencies optional and gate them behind the matching feature.
[features]
default = ["web"]
web = ["dioxus/web"]
server = ["dioxus/server"]
