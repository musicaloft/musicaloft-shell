[package]
name = "web"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
dioxus.workspace = true
ui.workspace = true

# dx enables exactly one of these per build: `web` for the wasm client and
# `server` for the fullstack server binary
[features]
default = ["web"]
web = ["dioxus/web"]
server = ["dioxus/server", "ui/server"]
