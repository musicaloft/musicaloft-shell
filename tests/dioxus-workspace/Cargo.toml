[workspace]
resolver = "3"
members = ["packages/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
dioxus = { version = "0.7.10", features = ["fullstack"] }

api = { path = "packages/api" }
ui = { path = "packages/ui" }

[workspace.metadata.crane]
name = "dioxus-workspace"
