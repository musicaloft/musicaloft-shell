[workspace]
resolver = "3"
members = ["api", "ui", "web"]

[workspace.package]
name = "web-app"
authors = ["municorn <municorn@musicaloft.com>"]
edition = "2024"
repository = "https://git.musicaloft.com/municorn/web-app"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.86"
argon2 = "0.5.3"
async-trait = "0.1.81"
axum = { version = "0.8", features = ["macros"] }
axum_session = "0.20"
axum_session_auth = "0.20"
axum_session_redispool = "0.11"
bb8 = "0.9"
chrono = { version = "0.4", features = ["serde"] }
diesel = { version = "2.3", features = ["postgres", "uuid", "chrono"] }
diesel-async = { version = "0.9", features = ["postgres", "bb8"] }
diesel-derive-enum = { version = "3.0.0-beta.1", features = ["postgres"] }
diesel_migrations = "2.2"
dioxus = { version = "0.7", features = ["fullstack", "router"] }
dioxus-html = { version = "0.7" }
dotenvy = "0.15.7"
redis = "1.2.0"
redis_pool = "0.10.0"
serde = { version = "1.0.204", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.10.0", features = ["v4", "v8", "fast-rng", "serde"] }

# transitive dep: explicitly enable the js feature for wasm targets
getrandom = { version = "0.2.17", features = ["js"] }

# workspace-internal crates
api = { path = "api" }
ui = { path = "ui" }
